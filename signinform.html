<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Bharat Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="top-brand">
    <img src="icons/emblem.png" alt="Emblem" class="top-emblem">
    <a href="/index.html">
      <img src="icons/websitelogo.png" alt="Bharat Portal" class="top-logo">
    </a>
  </div>

  <div class="signin-card">
    <h1 class="signin-title">
      Sign In to <span>Bharat Portal</span>
    </h1>

    <form id="signin-form">
      <input
        type="email"
        name="email"
        class="input-field"
        placeholder="Email*"
        required
      >
      <input
        type="password"
        name="password"
        class="input-field"
        placeholder="Password*"
        minlength="6"
        required
      >
      <button type="submit" class="submit-btn">
        Sign In
      </button>
      <p id="signin-message" class="form-message"></p>
    </form>

    <p class="bottom-link">
      Don't have an account?
      <a href="/signupform.html">Create a new account</a>
    </p>
  </div>
<script src="auth.js"></script>
<script src="save.js"></script>
</body>
</html>

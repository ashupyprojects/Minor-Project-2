<script src="schemes.js"></script>

<script>
function calculateAge(dob) {
  const birth = new Date(dob);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();

  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
    age--;
  }

  return age;
}

function applyFilter() {

  const dob = document.getElementById("dob").value;
  const state = document.getElementById("state").value;
  const category = document.getElementById("category").value;

  if (!dob || !state || !category) {
    alert("Please fill required fields");
    return;
  }

  // 🔥 FILTER USING PAGE (your existing structure)
  const filtered = schemes.filter(s => {

    if (category === "Student") return s.page.includes("student") || s.page.includes("education");
    if (category === "Farmer") return s.page.includes("agriculture") || s.page.includes("farmer");
    if (category === "Senior Citizen") return s.page.includes("senior");
    if (category === "Entrepreneur") return s.page.includes("entrepreneur") || s.page.includes("employment");

    return true;
  });

  displaySchemes(filtered);
}

function displaySchemes(schemes) {

  const container = document.getElementById("schemesContainer");
  container.innerHTML = "";

  if (!schemes || schemes.length === 0) {
    container.innerHTML = "<p>No eligible schemes found</p>";
    return;
  }

  schemes.forEach(s => {
    const div = document.createElement("div");
    div.classList.add("scheme-card");

    div.innerHTML = `
      <div class="scheme-left">
        <span class="tag">${s.page}</span>
        <span class="scheme-name">${s.name}</span>
      </div>

      <div class="scheme-right">
        <a href="${s.page}" target="_blank" class="view-btn">View</a>
        <button class="save-btn" onclick="saveScheme('${s.name}', '${s.page}')">
          Add to My Schemes
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}
</script>

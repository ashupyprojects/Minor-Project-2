<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bharat Portal - Eligibility</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .filter-card {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    #schemesContainer {
      max-width: 900px;
      margin: 20px auto;
    }
  </style>
</head>

<body class="auth-body">

  <div class="top-brand">
    <img src="icons/emblem.png" class="top-emblem">
    <a href="/index.html">
      <img src="icons/websitelogo.png" class="top-logo">
    </a>
  </div>

  <div class="filter-card">
    <h2>Eligibility Search</h2>

    <input type="date" id="dob" class="input-field" required>

    <input type="text" id="state" class="input-field" placeholder="State*" required>

    <select id="category" class="input-field" required>
      <option value="">Select Category</option>
      <option value="Student">Student</option>
      <option value="Farmer">Farmer</option>
      <option value="Senior Citizen">Senior Citizen</option>
      <option value="Entrepreneur">Entrepreneur</option>
    </select>

    <button class="submit-btn" onclick="applyFilter()">Search Schemes</button>
  </div>

  <div id="schemesContainer"></div>

  <!-- IMPORTANT -->
  <script src="schemes.js"></script>
  <script src="save.js"></script>

  <script>
    function calculateAge(dob) {
      const birth = new Date(dob);
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();

      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
        age--;
      }

      return age;
    }

    function applyFilter() {
      const dob = document.getElementById("dob").value;
      const category = document.getElementById("category").value;

      if (!dob || !category) {
        alert("Please fill required fields");
        return;
      }

      // FRONTEND FILTER (OLD LOGIC)
      const filtered = schemes.filter(s => {

        if (category === "Student") return s.page.includes("student") || s.page.includes("education");
        if (category === "Farmer") return s.page.includes("agriculture") || s.page.includes("farmers");
        if (category === "Senior Citizen") return s.page.includes("senior");
        if (category === "Entrepreneur") return s.page.includes("entrepreneurs") || s.page.includes("employment");

        return true;
      });

      displaySchemes(filtered);
    }

    function displaySchemes(schemes) {
      const container = document.getElementById("schemesContainer");
      container.innerHTML = "";

      if (schemes.length === 0) {
        container.innerHTML = "<p>No eligible schemes found</p>";
        return;
      }

      schemes.forEach(s => {
        const div = document.createElement("div");
        div.classList.add("scheme-card");

        div.innerHTML = `
          <div class="scheme-left">
            <span class="tag">${s.page}</span>
            <span class="scheme-name">${s.name}</span>
          </div>

          <div class="scheme-right">
            <a href="${s.page}" target="_blank" class="view-btn">View</a>
            <button class="save-btn" onclick="saveScheme('${s.name}', '${s.page}')">
              Add to My Schemes
            </button>
          </div>
        `;

        container.appendChild(div);
      });
    }
  </script>

</body>
</html>
